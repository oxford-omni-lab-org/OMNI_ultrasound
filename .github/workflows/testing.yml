name: testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          lfs: 'false'
          
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Check model weights
        run: ls -lh ${GITHUB_WORKSPACE}/path/to/weights

      - name: Install and Test
        run: |
          pip install .[all]
          export PYTHONPATH=$PYTHONPATH:${GITHUB_WORKSPACE}/src
          ftlbr_download_modelweights --force --testdata
          pytest --cov-report term-missing --cov=src --doctest-modules src/fetalbrain/ Tests/

